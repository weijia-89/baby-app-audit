name: Weekly Canary Test

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  HARNESS_VERSION: "3.0.0-loop3"

jobs:
  canary:
    name: Weekly Canary (Pebbi Positive Control)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify harness health
        run: |
          echo "Running weekly canary test..."
          echo "Harness version: ${HARNESS_VERSION}"
          
          # Check document integrity
          grep -q "## Part 0" APK_PRIVACY_TEST_HARNESS.md || exit 1
          grep -q "## Part 5.5" APK_PRIVACY_TEST_HARNESS.md || exit 1
          echo "Document integrity: OK"
          
          # Check review files
          test -f REVIEW_LOOP_1.md || exit 1
          test -f REVIEW_LOOP_2.md || exit 1
          test -f REVIEW_LOOP_3.md || exit 1
          test -f REVIEW_LOOP_4_BABY_BUDDY.md || exit 1
          echo "Review files: OK"

      - name: Generate canary report
        run: |
          mkdir -p canary-results
          cat > canary-results/canary-$(date +%Y%m%d).json <<EOF
          {
            "test_type": "canary",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "harness_version": "${HARNESS_VERSION}",
            "status": "HEALTH_CHECK_PASSED",
            "app_tested": "pebbi",
            "expected_result": "outbound_traffic_detected",
            "note": "This is a weekly structural canary. Full traffic capture requires emulator setup."
          }
          EOF

      - name: Upload canary result
        uses: actions/upload-artifact@v4
        with:
          name: canary-weekly-$(date +%Y%m%d)
          path: canary-results/
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Canary test failed. The harness may be broken."
          echo "Please review the test environment and verify all tools are available."
